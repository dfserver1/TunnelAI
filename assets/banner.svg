<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.55" stop-color="#101d38"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320"/>
  </g>

  <!-- logo mark: tunnel arch + arrow -->
  <g transform="translate(70,96)">
    <path d="M0 128 A112 112 0 0 1 224 128 L196 128 A84 84 0 0 0 28 128 Z" fill="url(#accent)"/>
    <path d="M56 128 H168 M144 108 L172 128 L144 148" stroke="#0b1426" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="128" r="8" fill="#22d3ee"/>
    <circle cx="196" cy="128" r="8" fill="#34d399"/>
  </g>

  <!-- title -->
  <text x="330" y="150" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="-1">Tunnel<tspan fill="#22d3ee">AI</tspan></text>
  <text x="334" y="192" fill="#9fb6d4" font-size="26">Portable AI-to-PC bridge · MCP over Cloudflare tunnel</text>

  <!-- assistant chips -->
  <g font-size="20" font-weight="600">
    <g transform="translate(334,224)">
      <rect width="150" height="46" rx="23" fill="#10233f" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="75" y="30" fill="#e6f6ff" text-anchor="middle">ChatGPT</text>
    </g>
    <g transform="translate(498,224)">
      <rect width="150" height="46" rx="23" fill="#10233f" stroke="#34d399" stroke-width="1.5"/>
      <text x="75" y="30" fill="#e6fff4" text-anchor="middle">Claude</text>
    </g>
    <g transform="translate(662,224)">
      <rect width="150" height="46" rx="23" fill="#10233f" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="75" y="30" fill="#f1ebff" text-anchor="middle">Gemini</text>
    </g>
    <g transform="translate(826,224)">
      <rect width="196" height="46" rx="23" fill="#10233f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="98" y="30" fill="#fff7e0" text-anchor="middle">Antigravity</text>
    </g>
    <text x="1044" y="254" fill="#7f9cc0" font-size="18" font-weight="400">→ your PC</text>
  </g>

  <!-- tunnel bar -->
  <rect x="70" y="292" width="1060" height="6" rx="3" fill="url(#tunnel)"/>

  <!-- tags -->
  <g font-size="16" fill="#8fb0d4">
    <text x="70" y="34">MCP · folder-scoped · 127.0.0.1</text>
    <text x="1130" y="34" text-anchor="end">15 skills · OCR · PDF · diagrams · sentinel · MIT</text>
  </g>
</svg>
